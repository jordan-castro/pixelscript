<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelScript</title>
    <script src="pxswrap.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://unpkg.com/codejar-linenumbers/js/codejar-linenumbers.css" />

    <style>
        #editor {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .language-btns {
            background-color: #58a5f5;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            cursor: pointer;
        }

        .language-btn:hover {
            border-left: 1px solid white;
            border-right: 1px solid white;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            background-color: #2087f2;
        }

        .language-btn {
            color: white;
        }

        .codejar-linenumber {
            padding-left: 5px !important;
        }

        .code-container {
            background-color: #091540;
            border-radius: 10px;
            padding-bottom: 10px;
        }

        #header-top {
            display: flex;
            background-color: #ABD2FA;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        .circles-row {
            display: flex;
            gap: 2px;
            padding: 5px;
        }

        .little-circle {
            border-radius: 50%;
            margin: 1.5px;
        }

        body {
            background-color: #7492b9;
        }

        .code-editor {
            color: white;
        }

        .operator {
            background-color: transparent !important;
        }

        .pxs-btn {
            padding: 0% !important;
            font-size: 10pt;
        }

        #run-btn {
            padding-right: 10px;
            background-color: #2A7C13;
            color: white;
            padding-left: 10px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            border-bottom-left-radius: 10px;
            cursor: pointer;
        }

        .code-result-text {
            color: white;
            padding-left: 10px;
        }
    </style>

    <script>
        var LANGUAGE = 'lua';
        var READY = false;

        function create_code_name(name) {
            let code_name = `${name}_code`;
            return code_name;
        }

        function read_code(name) {
            return localStorage.getItem(create_code_name(name));
        }

        function hide_terminal(lang) {
            const term = document.getElementById(lang);
            term.hidden = true;
        }

        function show_terminal(lang) {
            const terminal = document.getElementById(lang);
            terminal.hidden = false;
        }

        function setLanguage(lang) {
            LANGUAGE = lang;

            if (lang == 'lua') {
                hide_terminal('js-editor');
                hide_terminal('py-editor');
                show_terminal('lua-editor');
            } else if (lang == 'python') {
                hide_terminal('js-editor');
                show_terminal('py-editor');
                hide_terminal('lua-editor');
            } else if (lang == 'js') {
                show_terminal('js-editor');
                hide_terminal('py-editor');
                hide_terminal('lua-editor');
            }
        }

        function run_program() {
            // Check defined
            if (!READY) {
                // TODO: add error message.
                return;
            }

            // Otherwise grab the text!
            let code = read_code(LANGUAGE);

            let runtime = null;
            if (LANGUAGE == 'lua') {
                runtime = pxs_Runtime.pxs_Lua;
            } else if (LANGUAGE == 'python') {
                runtime = pxs_Runtime.pxs_Python;
            } else if (LANGUAGE == 'js') {
                runtime = pxs_Runtime.pxs_JavaScript;
            }

            // TODO: add error messaage.
            if (runtime == null) {
                return;
            }
            let val = pxs_exec(runtime, code, "<web>");

            pxs_freevar(val);
        }
    </script>
</head>

<body>
    <div class="container">
        <!-- Title -->
        <h1>PixelScript</h1>
        <h6>A multi scripting runtime library.</h6>
        <!-- Language selection -->
        <!-- <div class="container text-center">
        </div> -->
        <div class="code-container">
            <div class="row p-0 m-0" id="header-top">
                <div class="col">
                    <div class="row row-cols-auto">
                        <div class="col px-0">
                            <div class="circles-row">
                                <div class="little-circle" style="background-color: red; width: 10px; height: 10px;">
                                </div>
                                <div class="little-circle" style="background-color: yellow; width: 10px; height: 10px;">
                                </div>
                                <div class="little-circle" style="background-color: green; width: 10px; height: 10px;">
                                </div>
                            </div>
                        </div>
                        <div class="col">
                            <div class="language-btns row row-cols-auto">
                                <div class="col language-btn">
                                    <div onclick="setLanguage('lua')">main.lua</div>
                                </div>
                                <div class="col language-btn">
                                    <div onclick="setLanguage('python')">main.py</div>
                                </div>
                                <div class="col language-btn">
                                    <div onclick="setLanguage('js')">main.js</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col px-0 m-0">
                    <div class="position-relative">
                        <div id="run-btn" class="position-absolute top-0 end-0" onclick="run_program()">Run</div>
                    </div>
                </div>
            </div>
            <!-- Editor -->
            <div id="lua-editor" class="code-editor"></div>
            <div id="py-editor" class="code-editor" hidden></div>
            <div id="js-editor" class="code-editor" hidden></div>
        </div>
        <div class="code-container" style="margin-top: 10px;">
            <!-- <div class="code-result-text">Test</div> -->
            <!-- <div class="code-result-text">Test</div>
            <div class="code-result-text">Test</div>
            <div class="code-result-text">Test</div> -->
            <!-- <div class="code-result-text">Test</div> -->
        </div>
    </div>
    <script>
        var Module = {
            onRuntimeInitialized: function () {
                console.log("PXS is ready.");
                pxs_wrap(Module);
                READY = true;
            }
        };
    </script>

    <script type="module">
        import { CodeJar } from 'https://cdn.jsdelivr.net/npm/codejar@4.3.0/dist/codejar.js';
        import { withLineNumbers } from 'https://unpkg.com/codejar-linenumbers/es/index.js';

        let editors = [
            ['lua-editor', 'lua'],
            ['py-editor', 'python'],
            ['js-editor', 'javascript']
        ];

        let jars = [];

        for (const e of editors) {
            let editor = document.querySelector(`#${e[0]}`);
            let highlight = editor => {
                editor.innerHTML = Prism.highlight(editor.textContent, Prism.languages[e[1]], e[1])
            };

            const jar = CodeJar(editor, withLineNumbers(highlight), {
                tab: '    ',
            });

            let code_name = create_code_name(e[1]);

            jar.updateCode(read_code(e[1]));
            jar.onUpdate(code => {
                localStorage.setItem(code_name, code)
            });

            jars.push(jar);
        }
    </script>
    <script src="pixelscript.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-lua.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/codejar@4.3.0/dist/cursor.js"></script>
</body>

</html>
